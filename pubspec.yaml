name: poney_au_chaud
description: "Bien Couvert — La bonne couverture, au bon moment."
# Package name kept as poney_au_chaud for continuity; display name is Bien Couvert.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  uuid: ^4.6.0
  intl: ^0.20.2
  equatable: ^2.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1
  collection: ^1.19.1
  http: ^1.6.0
  package_info_plus: ^8.0.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/branding/
    - google_fonts/

  fonts:
    - family: Outfit
      fonts:
        - asset: google_fonts/Outfit-Regular.ttf
          weight: 400
        - asset: google_fonts/Outfit-Medium.ttf
          weight: 500
        - asset: google_fonts/Outfit-SemiBold.ttf
          weight: 600
    - family: Fraunces
      fonts:
        - asset: google_fonts/Fraunces-Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#C5D7C9"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 8
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#C5D7C9"
